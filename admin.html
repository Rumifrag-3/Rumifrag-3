<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RUMI - Owner Summary</title>
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}input{padding:12px;width:250px;border-radius:8px;background:#222;color:#fff;border:1px solid #444}button{padding:12px 20px;background:gold;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin:10px}table{width:100%;max-width:900px;margin:20px auto;border-collapse:collapse;font-size:13px}th,td{border:1px solid #444;padding:8px;text-align:left}</style></head>
<body><div id="login"><img src="images/logo.jpg" style="width:100px;border-radius:50%"><h1 style="color:gold">RUMI FRAGRANCE - OWNER ONLY</h1><p>Summary Sheet - Password Protected</p><input type="password" id="p" placeholder="Password"><br><button onclick="check()">OPEN SUMMARY</button><p id="e" style="color:red"></p></div>
<div id="data" style="display:none"><h2 style="color:gold">All Orders - Auto Saved</h2><p>Ye data Google Drive Sheet se sync hoga jab aap Sheet link lagayenge</p><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Perfume</th><th>Qty</th><th>Total</th><th>Address</th></tr></thead><tbody id="list"></tbody></table><button onclick="window.print()">Print / Save PDF</button></div>
<script>function check(){if(document.getElementById('p').value==='Rumi777'){document.getElementById('login').style.display='none';document.getElementById('data').style.display='block';let o=JSON.parse(localStorage.getItem('rumi_orders')||'[]');document.getElementById('list').innerHTML=o.map(x=>`<tr><td>${x.date||''}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.p}</td><td>${x.q}</td><td>${x.total}</td><td>${x.addr}</td></tr>`).join('')||'<tr><td colspan=7>No Orders Yet</td></tr>'}else document.getElementById('e').innerText='Galat Password'}</script></body></html>
